name: Keep Backend Warm

# The API runs on Render's free tier, which puts the service to sleep after
# 15 minutes without traffic. The first visitor afterwards eats the cold start
# — measured at 32.5 s on 24 Sep 2026 — and the homepage's startup calls
# (settings/mock-mode, events/getallevents) sit on that path.
#
# Pinging a cheap public endpoint every 10 minutes keeps the instance awake.
# One always-on free service uses ~720 of Render's 750 free hours/month, so
# this only works while it is the sole free service on the account.
#
# Notes:
# - GitHub only runs scheduled workflows from the default branch, so this is
#   inactive until it lands on main. It can be triggered by hand before then.
# - GitHub disables schedules in repos with no activity for 60 days; a push
#   re-enables them.
# - Target should move to GET /api/health once the backend adds one. /api/ping
#   exists but sits behind authentication (401), so it is not usable here.
# - This is a stop-gap. The real fix is a paid always-on plan (open question
#   Q11 from the Jul 6 meeting).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-backend-warm
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        env:
          URL: https://xktradingfloor-backend.onrender.com/api/settings/mock-mode
        run: |
          # --retry covers the cold-start case: a sleeping instance can take
          # 30 s+ to answer the first request, which is exactly the scenario
          # this job exists to prevent from reaching real visitors.
          out=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code} %{time_total}' \
            --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors \
            "$URL") || { echo "::error::backend unreachable"; exit 1; }
          code=${out% *}; secs=${out#* }
          echo "HTTP $code in ${secs}s"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::unexpected status $code"; exit 1; }
