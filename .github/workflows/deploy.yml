name: Deploy Frontend to Bluehost

on:
  push:
    branches:
      - main
  # The backend calls GitHub's dispatches API with this event type when a post,
  # event or company is published (deliverable B25), so the prerendered pages,
  # sitemap and llms.txt pick it up within minutes instead of at the next
  # release. Always builds main.
  repository_dispatch:
    types: [content-published]
  # Manual "rebuild the live site" button in the Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "SSH deploy only: list what would change on the server, change nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+; on 18 the build died with "crypto.hash is not a
          # function" as soon as index.html carried an inline <style>. 18 is also EOL.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build for production (base = /)
        working-directory: ./frontend
        run: npm run build:prod

      # SSH + rsync is the main route: it resumes cleanly and only sends files
      # whose content changed. Bluehost's FTP server kept dropping the
      # connection after a few files (7 Oct 2026). --delete removes files the
      # build no longer makes (old asset hashes, hidden companies' pages);
      # the P filters protect what lives only on the server.
      - name: Deploy to Bluehost via SSH (rsync)
        if: ${{ env.SSH_KEY != '' }}
        env:
          SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
          SSH_PATH: ${{ secrets.BLUEHOST_SSH_PATH }}
          SSH_PORT: ${{ secrets.BLUEHOST_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          FLAGS="-rlz --checksum --delete --stats"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run --itemize-changes"; fi
          rsync $FLAGS \
            --filter='P /cgi-bin/***' \
            --filter='P /temp/***' \
            --filter='P /.well-known/***' \
            --filter='P /.ftp-deploy-sync-state.json' \
            --filter='P /.ftpquota' \
            --filter='P error_log' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o ServerAliveInterval=15" \
            ./frontend/docs/ "$SSH_USER@$SSH_HOST:$SSH_PATH"
          rm -f ~/.ssh/deploy_key

      # Fallback while the SSH key secret isn't set.
      - name: Deploy to Bluehost via FTP
        if: ${{ env.SSH_KEY == '' && env.DRY_RUN != 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_HOST }}
          username: ${{ secrets.BLUEHOST_USER }}
          password: ${{ secrets.BLUEHOST_PASSWORD }}
          server-dir: ${{ secrets.BLUEHOST_PATH }}
          local-dir: ./frontend/docs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          # Bluehost's FTP server is slow to answer at times; the default 30 s
          # control-socket timeout failed two deploys in a row on 7 Oct 2026.
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
      # Cloudflare fronts the site. index.html is served with Cache-Control:
      # no-cache from Bluehost, so today every visit goes to origin (~1.25 s on
      # mobile). The plan is an edge cache rule for HTML; that is only safe if a
      # deploy purges the edge, otherwise the previous index.html keeps being
      # served until the TTL runs out. Hashed assets are immutable, so purging
      # everything is cheap. No-op until CLOUDFLARE_ZONE_ID and
      # CLOUDFLARE_API_TOKEN (Zone > Cache Purge permission) are added as secrets.
      # Tell Bing and the other IndexNow engines about every sitemap URL, so new
      # and changed pages get crawled within hours instead of weeks. Never
      # fails the deploy.
      - name: Submit sitemap URLs to IndexNow
        if: ${{ env.DRY_RUN != 'true' }}
        working-directory: ./frontend
        run: node scripts/indexnow.mjs

      - name: Purge Cloudflare cache
        # The secrets context is not allowed in a step-level if; the job-level env
        # below mirrors the two secrets so the check can read them from env.*
        if: ${{ env.CF_ZONE != '' && env.CF_TOKEN != '' && env.DRY_RUN != 'true' }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
