name: Deploy Frontend to Bluehost

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+; on 18 the build died with "crypto.hash is not a
          # function" as soon as index.html carried an inline <style>. 18 is also EOL.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build for production (base = /)
        working-directory: ./frontend
        run: npm run build:prod

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_HOST }}
          username: ${{ secrets.BLUEHOST_USER }}
          password: ${{ secrets.BLUEHOST_PASSWORD }}
          server-dir: ${{ secrets.BLUEHOST_PATH }}
          local-dir: ./frontend/docs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
      # Cloudflare fronts the site. index.html is served with Cache-Control:
      # no-cache from Bluehost, so today every visit goes to origin (~1.25 s on
      # mobile). The plan is an edge cache rule for HTML; that is only safe if a
      # deploy purges the edge, otherwise the previous index.html keeps being
      # served until the TTL runs out. Hashed assets are immutable, so purging
      # everything is cheap. No-op until CLOUDFLARE_ZONE_ID and
      # CLOUDFLARE_API_TOKEN (Zone > Cache Purge permission) are added as secrets.
      - name: Purge Cloudflare cache
        if: ${{ secrets.CLOUDFLARE_ZONE_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
